<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Economic Index Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#4f46e5" />
<!-- iOS "Add to Home Screen" support: opens full-screen, no Safari chrome -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Index Tracker" />
</head>
<body>
  <header class="topbar">
    <h1>Economic Index Tracker</h1>
    <button id="refresh-btn" class="refresh-btn">Refresh</button>
  </header>

  <main>
    <section class="indexes-section">
      <h2>Market Indexes &middot; 50-Day Trend</h2>
      <div id="indexes-status" class="status-text"></div>
      <div id="indexes-grid" class="indexes-grid"></div>
    </section>

    <section class="search-section">
      <h2>Look Up a Company</h2>
      <form id="search-form" class="search-form">
        <input
          id="search-input"
          type="text"
          placeholder="Ticker symbol, e.g. AAPL"
          maxlength="10"
          autocapitalize="characters"
          autocomplete="off"
        />
        <button type="submit">Search</button>
      </form>
      <div id="search-status" class="status-text"></div>
      <div id="search-result"></div>
    </section>

    <section class="watchlist-section">
      <h2>My Watchlist</h2>

      <div class="code-bar">
        <span id="watchlist-code-label" class="code-label muted">No code yet</span>
        <button id="watchlist-copy-btn" class="code-btn" type="button" hidden>Copy</button>
      </div>
      <form id="watchlist-code-form" class="search-form code-form">
        <input
          id="watchlist-code-input"
          type="text"
          placeholder="Have a code from another device? Enter it"
          maxlength="6"
          autocapitalize="characters"
          autocomplete="off"
        />
        <button type="submit">Load</button>
      </form>

      <form id="watchlist-form" class="search-form">
        <input
          id="watchlist-input"
          type="text"
          placeholder="Add a ticker, e.g. MSFT"
          maxlength="10"
          autocapitalize="characters"
          autocomplete="off"
        />
        <button type="submit">Add</button>
      </form>
      <div id="watchlist-status" class="status-text"></div>
      <div id="watchlist-grid" class="indexes-grid"></div>
    </section>

    <section class="news-section">
      <h2>Related News</h2>
      <div id="news-status" class="status-text"></div>
      <ul id="news-list" class="news-list"></ul>
    </section>
  </main>

  <script src="/script.js"></script>
</body>
</html>
